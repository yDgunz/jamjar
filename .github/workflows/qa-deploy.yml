name: QA Deploy

on:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read
  packages: write
  pull-requests: write

env:
  # Must match the server's CPU; keep in step with deploy.yml
  IMAGE_PLATFORM: linux/amd64

concurrency:
  group: qa-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      (github.event.action == 'labeled' && github.event.label.name == 'deploy-qa') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'deploy-qa'))
    runs-on: ubuntu-latest
    steps:
      - name: Sanitize branch name
        id: branch
        env:
          RAW_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          # The branch name ends up in commands run on the server: allow only
          # characters that mean nothing to a shell
          if [[ ! "$RAW_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::Branch name has characters a QA deploy doesn't allow (use letters, digits, . _ / -)"
            exit 1
          fi

          SANITIZED=$(echo "$RAW_BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's|[^a-z0-9-]|-|g' | sed 's|-\+|-|g' | sed 's|^-\+||;s|-\+$||' | cut -c1-63)

          if [[ -z "$SANITIZED" || "$SANITIZED" =~ ^(main|master|prod|www|audio|api)$ ]]; then
            echo "::error::Branch name can't be used for a QA environment: '$SANITIZED'"
            exit 1
          fi

          echo "name=$SANITIZED" >> "$GITHUB_OUTPUT"
          echo "raw=$RAW_BRANCH" >> "$GITHUB_OUTPUT"
          # GHCR names must be lowercase
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-qa:${SANITIZED}" >> "$GITHUB_OUTPUT"

      # The image is built here and pulled by the server, so a QA deploy doesn't
      # compete with production for memory
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.IMAGE_PLATFORM }}
          push: true
          provenance: false
          tags: ${{ steps.branch.outputs.image }}
          cache-from: |
            type=gha,scope=qa
            type=gha
          cache-to: type=gha,mode=max,scope=qa

      - name: Deploy QA environment
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          # Short-lived token (expires when this job ends), used only to pull the image
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed as environment variables, never pasted into the script text
          QA_NAME: ${{ steps.branch.outputs.name }}
          QA_REPO_URL: https://github.com/${{ github.repository }}.git
          QA_REF: ${{ steps.branch.outputs.raw }}
          QA_IMAGE: ${{ steps.branch.outputs.image }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          envs: GHCR_USER,GHCR_TOKEN,QA_NAME,QA_REPO_URL,QA_REF,QA_IMAGE
          script: |
            set -e
            source /opt/jamjar/.env
            export JAM_QA_PASSWORD
            trap 'docker logout ghcr.io > /dev/null 2>&1 || true' EXIT
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            /opt/jamjar/scripts/qa-deploy.sh "$QA_NAME" "$QA_REPO_URL" "$QA_REF" "$QA_IMAGE"

      - name: Comment on PR
        uses: actions/github-script@v9
        with:
          script: |
            const branch = '${{ steps.branch.outputs.name }}';
            const url = `https://${branch}.jam-jar.app`;
            const marker = '<!-- qa-deploy -->';
            const body = `${marker}\n🔗 **QA environment deployed:** ${url}\n\nLogin with any seeded user and the QA password.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }

      - name: Prune old QA images from the registry
        # Housekeeping only; a failure here must not fail the deploy
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}-qa
          package-type: container
          min-versions-to-keep: 2
