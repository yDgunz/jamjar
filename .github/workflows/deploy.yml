name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pre-deploy database backup
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            set -e
            cd /opt/jamjar
            docker compose exec -T app /app/scripts/backup-db.sh || echo "Pre-deploy backup skipped (container not running)"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            set -e
            cd /opt/jamjar

            PREV_COMMIT=$(git rev-parse HEAD)
            PREV_SHORT=$(git rev-parse --short HEAD)
            git pull
            echo "Deploying $(git rev-parse --short HEAD) (previous: $PREV_SHORT)"

            # --pull refreshes base images so OS packages (OpenSSL, ffmpeg) get security updates
            docker compose build --pull
            docker compose up -d

            # /health queries the DB; give the app up to ~60s to come up
            healthy() {
              for i in $(seq 1 12); do
                sleep 5
                if curl -sf --max-time 5 http://localhost:8000/health > /dev/null; then
                  echo "Health check passed (attempt $i)"
                  return 0
                fi
                echo "Health check attempt $i/12 failed"
              done
              return 1
            }

            if ! healthy; then
              echo "ERROR: new version unhealthy; rolling back to $PREV_SHORT"
              docker compose logs --tail 100 app || true
              # reset (not checkout) keeps the branch attached so the next git pull works
              git reset --hard "$PREV_COMMIT"
              docker compose build
              docker compose up -d
              if healthy; then
                echo "Rollback succeeded; previous version is serving."
              else
                echo "CRITICAL: rollback is also unhealthy. Manual intervention required."
              fi
              exit 1
            fi

            docker image prune -f

      - name: Set up daily backup cron job
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            CRON_CMD="0 3 * * * cd /opt/jamjar && docker compose exec -T app /app/scripts/backup-db.sh >> /var/log/jam-backup.log 2>&1"
            (crontab -l 2>/dev/null | grep -v "backup-db.sh" ; echo "$CRON_CMD") | crontab -
