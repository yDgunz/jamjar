services:
  app:
    # Production runs the image CI built and pushed to GHCR: the deploy pulls it and
    # tags it jamjar:live (nothing is built on the server). `docker compose up --build`
    # still builds it locally.
    image: jamjar:live
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - jam-data:/data
    environment:
      - JAM_DATA_DIR=/data
      - JAM_STATIC_DIR=/app/static
      - JAM_JWT_SECRET=${JAM_JWT_SECRET}
      - JAM_API_KEY=${JAM_API_KEY}
      - JAM_R2_ENABLED=${JAM_R2_ENABLED:-false}
      - JAM_R2_ACCOUNT_ID=${JAM_R2_ACCOUNT_ID:-}
      - JAM_R2_ACCESS_KEY_ID=${JAM_R2_ACCESS_KEY_ID:-}
      - JAM_R2_SECRET_ACCESS_KEY=${JAM_R2_SECRET_ACCESS_KEY:-}
      - JAM_R2_BUCKET=${JAM_R2_BUCKET:-}
      - JAM_R2_CUSTOM_DOMAIN=${JAM_R2_CUSTOM_DOMAIN:-}
      - JAM_SMTP_HOST=${JAM_SMTP_HOST:-}
      - JAM_SMTP_PORT=${JAM_SMTP_PORT:-587}
      - JAM_SMTP_USER=${JAM_SMTP_USER:-}
      - JAM_SMTP_PASSWORD=${JAM_SMTP_PASSWORD:-}
      - JAM_SMTP_FROM=${JAM_SMTP_FROM:-}
      - JAM_APP_URL=${JAM_APP_URL:-}
      - JAM_GOOGLE_SERVICE_ACCOUNT=${JAM_GOOGLE_SERVICE_ACCOUNT:-}
      - JAM_IDENTIFY_HOUR=${JAM_IDENTIFY_HOUR:-8}
    restart: unless-stopped
    # Let in-flight processing jobs finish on deploys/restarts (the app waits up to
    # JAM_SHUTDOWN_GRACE_SEC=270s for them before exiting)
    stop_grace_period: 5m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  jam-data:
